[project]
name = "abridge-engine"
version = "0.1.0"
description = "Private local benefits prescreening and financial planning"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3", "httpx>=0.28,<1", "trafilatura>=2,<3", "pyyaml>=6,<7", "policyengine-us==2.40.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "respx>=0.22,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["llm: real local llama-server smoke evaluation"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["policyengine_us.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["abridge"]
